<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; position: relative; z-index: 1; }
    .login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .login-card p.sub { color: var(--text-muted); margin-bottom: 24px; font-family: var(--font-mono); font-size: 0.85rem; }
    .login-card label { display: block; font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); margin: 14px 0 6px; }
    .login-card input { width: 100%; padding: 12px 14px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border); border-radius: var(--radius); font: inherit; }
    .login-card input:focus { outline: none; border-color: var(--accent-color); }
    .login-card button { width: 100%; margin-top: 22px; padding: 12px; cursor: pointer; border: 0; border-radius: var(--radius); background: var(--accent-color); color: var(--on-accent); font: 600 1rem var(--font-sans); }
    .login-card button:disabled { opacity: .6; cursor: wait; }
    .login-error { color: #ff6b6b; font-size: 0.9rem; margin-top: 14px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="login-wrap">
    <form class="login-card" id="login-form" novalidate>
      <h1>&lt;admin<span style="color:var(--accent-color)">/&gt;</span></h1>
      <p class="sub">sign in to manage the blog</p>
      <label for="email">email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="submit">Sign in</button>
      <div class="login-error" id="error" role="alert"></div>
    </form>
  </div>

  <script type="module">
    import { auth } from "/assets/firebase-config.js";
    import { isAdmin } from "/assets/admin/guard.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error");
    const btn = document.getElementById("submit");
    let signingIn = false;

    // Already signed in as admin? Go straight to the dashboard.
    onAuthStateChanged(auth, (user) => {
      if (!signingIn && isAdmin(user)) location.replace("/admin");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      signingIn = true;
      btn.disabled = true;
      try {
        const cred = await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        if (!isAdmin(cred.user)) {
          await signOut(auth);
          throw new Error("not-admin");
        }
        location.replace("/admin");
      } catch (err) {
        errorBox.textContent = "Invalid email or password.";
        signingIn = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
