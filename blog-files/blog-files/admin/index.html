<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container" style="padding-top:60px;position:relative;z-index:1">
    <h1>Dashboard</h1>
    <p id="who" style="color:var(--text-muted);margin:8px 0 24px">Checking sign-in…</p>
    <p>Login works. The post list and editor come next.</p>
    <button id="logout" class="btn btn-outline" style="margin-top:24px;cursor:pointer">Log out</button>
  </div>
  <script type="module">
    import { requireAdmin, logout } from "/assets/admin/guard.js";
    const user = await requireAdmin();
    document.getElementById("who").textContent = "Signed in as " + user.email;
    document.getElementById("logout").addEventListener("click", logout);
  </script>
</body>
</html>
